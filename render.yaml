services:
  - type: web
    name: invoice-extractor-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DO_INFERENCE_API_KEY
        sync: false
      - key: LLM_MODEL
        value: llama3.3-70b-instruct
      - key: FRONTEND_ORIGIN
        sync: false
